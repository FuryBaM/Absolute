name: Apply array pipeline fix

on:
  push:
    branches:
      - agent/stabilize-foundation
    paths:
      - tools/apply_array_pipeline_fix.py
      - .github/workflows/apply-array-pipeline-fix.yml
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_array_pipeline_fix.py
      - .github/workflows/apply-array-pipeline-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-foundation
          fetch-depth: 0

      - name: Apply source repair
        run: python3 tools/apply_array_pipeline_fix.py

      - name: Install LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang lld cmake ninja-build

      - name: Build compiler
        run: |
          cmake -S . -B build-array-fix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABSOLUTE_ENABLE_LLVM=ON \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build build-array-fix --parallel 2

      - name: Build and run native array regression
        shell: bash
        run: |
          compiler="$(find build-array-fix -type f -name absolutec -perm -u+x | head -n 1)"
          test -n "$compiler"
          "$compiler" tests/arrays.abs --build-exe -o "$GITHUB_WORKSPACE/build-array-fix/arrays-native"
          output="$($GITHUB_WORKSPACE/build-array-fix/arrays-native)"
          printf '%s\n' "$output"
          grep -Fx 'arrays=90' <<< "$output"

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Absolute-CodeGen/src/codegen.cpp Absolute-CodeGen/src/codegen_module.cpp
          git commit -m "Restore proven array bounds optimization pipeline"
          git push origin HEAD:agent/stabilize-foundation
