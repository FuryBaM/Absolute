name: Apply array pipeline fix

on:
  push:
    branches:
      - agent/stabilize-foundation
    paths:
      - tools/apply_array_pipeline_fix.py
      - .github/workflows/apply-array-pipeline-fix.yml
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_array_pipeline_fix.py
      - .github/workflows/apply-array-pipeline-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-foundation
          fetch-depth: 0

      - name: Apply source repair
        run: python3 tools/apply_array_pipeline_fix.py

      - name: Install LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang lld cmake ninja-build

      - name: Configure compiler
        run: |
          cmake -S . -B build-array-fix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABSOLUTE_ENABLE_LLVM=ON \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Build compiler
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-array-fix --parallel 2 2>&1 | tee build-array-fix.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-pipeline-build-log
          path: build-array-fix.log

      - name: Compare array execution paths
        shell: bash
        run: |
          set +e
          mkdir -p array-diagnostics
          compiler="$(find build-array-fix -type f -name absolutec -perm -u+x | head -n 1)"
          test -n "$compiler" || exit 1

          "$compiler" tests/arrays.abs --emit-llvm -o array-diagnostics/arrays.ll \
            >array-diagnostics/emit.log 2>&1
          emit_status=$?

          lli array-diagnostics/arrays.ll \
            >array-diagnostics/lli-unoptimized.log 2>&1
          lli_status=$?

          opt -O3 array-diagnostics/arrays.ll -S -o array-diagnostics/arrays-opt.ll \
            >array-diagnostics/opt.log 2>&1
          opt_status=$?

          lli array-diagnostics/arrays-opt.ll \
            >array-diagnostics/lli-optimized.log 2>&1
          lli_opt_status=$?

          "$compiler" tests/arrays.abs --build-exe \
            -o "$GITHUB_WORKSPACE/build-array-fix/arrays-native" \
            >array-diagnostics/native-build.log 2>&1
          native_build_status=$?

          "$GITHUB_WORKSPACE/build-array-fix/arrays-native" \
            >array-diagnostics/native-run.log 2>&1
          native_run_status=$?

          {
            echo "emit_status=$emit_status"
            echo "lli_status=$lli_status"
            echo "opt_status=$opt_status"
            echo "lli_opt_status=$lli_opt_status"
            echo "native_build_status=$native_build_status"
            echo "native_run_status=$native_run_status"
          } | tee array-diagnostics/status.txt

          for log in array-diagnostics/*.log; do
            echo "===== $log ====="
            cat "$log"
          done

          grep -Fx 'arrays=90' array-diagnostics/native-run.log

      - name: Upload array diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-execution-diagnostics
          path: array-diagnostics

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Absolute-Analyzer/src/analyzer.cpp \
            Absolute-CodeGen/include/codegen_internal.h \
            Absolute-CodeGen/src/codegen.cpp \
            Absolute-CodeGen/src/codegen_module.cpp \
            Absolute-CodeGen/src/codegen_types.cpp \
            Absolute-CodeGen/src/codegen_values.cpp
          git commit -m "Fix multidimensional array declaration lowering"
          git push origin HEAD:agent/stabilize-foundation
