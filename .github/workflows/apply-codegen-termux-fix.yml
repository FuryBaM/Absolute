name: Apply CodeGen Termux fix

on:
  push:
    branches:
      - agent/stabilize-foundation
    paths:
      - tools/apply_codegen_termux_fix.py
      - .github/workflows/apply-codegen-termux-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-foundation
          fetch-depth: 0

      - name: Apply source fix
        run: python3 tools/apply_codegen_termux_fix.py

      - name: Configure LLVM build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build llvm-dev
          cmake -S . -B build-codegen-fix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DABSOLUTE_ENABLE_LLVM=ON \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Build CodeGen
        run: cmake --build build-codegen-fix --target Absolute-CodeGen --parallel 2

      - name: Commit final fix and remove staging files
        run: |
          rm tools/apply_codegen_termux_fix.py
          rm .github/workflows/apply-codegen-termux-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix LLVM 21 CodeGen implementation scope"
          git push origin HEAD:agent/stabilize-foundation
