name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev

      - name: Configure with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DBUILD_TESTING=ON
          -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Configure frontend (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DABSOLUTE_ENABLE_LLVM=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

  windows-llvm-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache portable LLVM SDK
        uses: actions/cache@v4
        with:
          path: .absolute/toolchains/llvm-18.1.8
          key: windows-llvm-18.1.8-sdk-v1

      - name: Bootstrap LLVM, build, and test natively
        shell: cmd
        run: build-windows.bat --bootstrap

      - name: WebAssembly tests (Node engine)
        shell: cmd
        run: ctest --test-dir .absolute\build\windows-release -C Release -R wasm --output-on-failure

  # Host-native smoke on macOS (often Apple Silicon arm64 on GitHub runners).
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew update
          brew install llvm@18 || brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm)"
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Configure Release with LLVM
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DABSOLUTE_ENABLE_LLVM=ON
          -DLLVM_DIR="${LLVM_DIR}"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Linux wasm smoke: build Absolute + run wasm ctests; optional wasmtime for WASI module.
  linux-wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang lld
          # wasm-ld often ships with lld package as wasm-ld-XX or via llvm
          which wasm-ld || which wasm-ld-18 || true
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v25.0.2/wasmtime-v25.0.2-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          sudo tar -xJf /tmp/wasmtime.tar.xz -C /usr/local --strip-components=1
          wasmtime --version

      - name: Configure Release with LLVM
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DABSOLUTE_ENABLE_LLVM=ON
          -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Wasm tests
        run: ctest --test-dir build -C Release -R wasm --output-on-failure
