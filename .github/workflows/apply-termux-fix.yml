name: Apply Termux test fixes

on:
  push:
    branches:
      - agent/fix-termux-tests-v4
    paths:
      - tools/apply_termux_fix.py
      - .github/workflows/apply-termux-fix.yml
  pull_request:
    branches:
      - agent/stabilize-foundation
    paths:
      - tools/apply_termux_fix.py
      - .github/workflows/apply-termux-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-termux-tests-v4
          fetch-depth: 0

      - name: Apply source changes
        run: python3 tools/apply_termux_fix.py

      - name: Validate CMake and scripts
        shell: bash
        run: |
          bash -n scripts/termux/build-termux.sh
          cmake -S . -B build-termux-validate -G Ninja \
            -DABSOLUTE_ENABLE_LLVM=OFF \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DABSOLUTE_TERMUX=ON \
            -DBUILD_TESTING=ON

      - name: Validate LLVM attribute checker
        shell: bash
        run: |
          cat > /tmp/value-references-llvm18.ll <<'EOF'
          define i64 @inspect(ptr nocapture nonnull readonly %value) {
            %const.ref.temporary = alloca i64
            ret i64 0
          }
          define void @add(ptr nonnull nocapture %value, i64 %amount) {
            ret void
          }
          EOF
          cmake -DIR_FILE=/tmp/value-references-llvm18.ll \
            -P tests/check-value-references-ir.cmake

          cat > /tmp/value-references-llvm21.ll <<'EOF'
          define i64 @inspect(ptr nonnull readonly captures(none) %value) {
            %const.ref.temporary = alloca i64
            ret i64 0
          }
          define void @add(ptr captures(none) nonnull %value, i64 %amount) {
            ret void
          }
          EOF
          cmake -DIR_FILE=/tmp/value-references-llvm21.ll \
            -P tests/check-value-references-ir.cmake

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            docs/termux-build.md \
            scripts/termux/build-termux.sh \
            tests/array-advanced.abs \
            tests/check-value-references-ir.cmake \
            tests/projects/multi-file/src/main.abs \
            tests/run-sanitizer-case.cmake
          git commit -m "Fix Termux runtime and sanitizer tests"
          git push origin HEAD:agent/fix-termux-tests-v4
