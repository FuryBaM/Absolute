name: Test hardening

on:
  pull_request:
    paths:
      - ".github/workflows/test-hardening.yml"
      - "Absolute-Compiler/**"
      - "Absolute-Parser/**"
      - "Absolute-Analyzer/**"
      - "Absolute-CodeGen/**"
      - "Absolute-Runtime/**"
      - "std/**"
      - "tests/**"
      - "tools/testing/**"
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: test-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  language-stress-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang lld cmake ninja-build

      - name: Build Release compiler
        run: |
          cmake -S . -B build-hardening -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABSOLUTE_ENABLE_LLVM=ON \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build build-hardening --parallel 2
          compiler="$(find build-hardening -type f -name absolutec -perm -u+x | head -n 1)"
          test -n "$compiler"
          echo "ABSOLUTEC=$compiler" >> "$GITHUB_ENV"

      - name: Build hardening programs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p hardening-logs
          status=0
          "$ABSOLUTEC" tests/concurrency-stress.abs \
            --build-exe -o "$GITHUB_WORKSPACE/build-hardening/concurrency-stress" \
            2>&1 | tee hardening-logs/concurrency-build.log || status=$?
          "$ABSOLUTEC" tests/collection-snapshot-stress.abs \
            --build-exe -o "$GITHUB_WORKSPACE/build-hardening/collection-snapshot-stress" \
            2>&1 | tee hardening-logs/collection-snapshot-build.log || status=$?
          exit "$status"

      - name: Run iterator snapshot stress
        run: "$GITHUB_WORKSPACE/build-hardening/collection-snapshot-stress"

      - name: Repeat real scheduler stress
        shell: bash
        run: |
          repeats=25
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            repeats=150
          fi
          for iteration in $(seq 1 "$repeats"); do
            echo "concurrency stress iteration $iteration/$repeats"
            timeout 30s "$GITHUB_WORKSPACE/build-hardening/concurrency-stress"
          done

      - name: Generate and run collection properties
        shell: bash
        run: |
          cases=40
          operations=120
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            cases=160
            operations=300
          fi
          python3 tools/testing/generate_collection_properties.py \
            --output tools/testing/generated-collection-properties.abs \
            --seed 12648430 \
            --cases "$cases" \
            --operations "$operations"
          "$ABSOLUTEC" tools/testing/generated-collection-properties.abs \
            --build-exe -o "$GITHUB_WORKSPACE/build-hardening/collection-properties"
          "$GITHUB_WORKSPACE/build-hardening/collection-properties"

      - name: Grammar and mutation fuzz compiler
        shell: bash
        run: |
          valid=75
          mutated=225
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            valid=300
            mutated=1200
          fi
          python3 tools/testing/compiler_fuzz.py \
            --compiler "$ABSOLUTEC" \
            --seed 689409 \
            --valid-cases "$valid" \
            --mutated-cases "$mutated" \
            --timeout 5 \
            --repro-dir fuzz-reproducers

      - name: Upload language hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-hardening-diagnostics
          path: |
            hardening-logs
            fuzz-reproducers
          if-no-files-found: ignore

  runtime-thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Build instrumented runtime
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DABSOLUTE_ENABLE_LLVM=OFF \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build-tsan --target Absolute-Runtime --parallel 2

      - name: Build scheduler TSan harness
        shell: bash
        run: |
          runtime="$(find build-tsan -maxdepth 2 -type f -name 'libAbsolute-Runtime.a' | head -n 1)"
          test -n "$runtime"
          clang++ -std=c++20 -O1 -g -fsanitize=thread -fno-omit-frame-pointer \
            tests/runtime-scheduler-tsan.cpp "$runtime" \
            -pthread -ldl -o build-tsan/runtime-scheduler-tsan

      - name: Run scheduler under ThreadSanitizer
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7
        run: |
          set -o pipefail
          mkdir -p hardening-logs
          repeats=3
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            repeats=10
          fi
          for iteration in $(seq 1 "$repeats"); do
            echo "TSan iteration $iteration/$repeats" | tee -a hardening-logs/tsan.log
            timeout 90s build-tsan/runtime-scheduler-tsan \
              2>&1 | tee -a hardening-logs/tsan.log
          done

      - name: Upload TSan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-tsan-diagnostics
          path: hardening-logs
          if-no-files-found: ignore
