name: Temporary complex language benchmark

on:
  pull_request:
    branches:
      - agent/stabilize-foundation
    paths:
      - ".github/workflows/complex-benchmark-temp.yml"
      - ".benchmark-payload/**"
  workflow_dispatch:

concurrency:
  group: complex-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Restore temporary benchmark suite
        shell: bash
        run: |
          cat .benchmark-payload/part-* | base64 --decode > /tmp/complex-suite-v2.tar.gz
          test "$(sha256sum /tmp/complex-suite-v2.tar.gz | cut -d' ' -f1)" = "5ef308efa716ad4a2cc1970def12c80a1880228d01f3b4e8f4e7259935e853f8"
          mkdir -p benchmarks
          tar -xzf /tmp/complex-suite-v2.tar.gz -C benchmarks
          find benchmarks/complex-suite-v2 -maxdepth 2 -type f -print | sort

      - name: Install LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang lld cmake ninja-build
          llvm-config --version
          clang++ --version | head -n 1
          go version
          java -version
          node --version
          python3 --version

      - name: Build Absolute Release compiler
        run: |
          cmake -S . -B .absolute/build/benchmark-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABSOLUTE_ENABLE_LLVM=ON \
            -DABSOLUTE_BUILD_EXAMPLE_PLUGINS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build .absolute/build/benchmark-release --parallel 2

      - name: Compile benchmark implementations
        shell: bash
        run: |
          set -euo pipefail
          suite="$GITHUB_WORKSPACE/benchmarks/complex-suite-v2"
          mkdir -p "$suite/bin"
          compiler="$(find .absolute/build/benchmark-release -type f -name absolutec -perm -u+x | head -n 1)"
          test -n "$compiler"
          echo "Absolute compiler: $compiler"
          for source in "$suite"/absolute/*.abs; do
            name="$(basename "$source" .abs)"
            "$compiler" "$source" --build-exe -o "$suite/bin/absolute-$name"
          done
          clang++ -O3 -march=native -ffp-contract=off -std=c++20 \
            "$suite/benchmark.cpp" -o "$suite/benchmark-cpp"
          (cd "$suite" && go build -trimpath -ldflags="-s -w" -o benchmark-go benchmark.go)
          (cd "$suite" && javac Benchmark.java)

      - name: Run benchmark
        env:
          ABSOLUTE_BENCH_BIN_DIR: ${{ github.workspace }}/benchmarks/complex-suite-v2/bin
        run: |
          cd benchmarks/complex-suite-v2
          python3 run_benchmark.py
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: complex-benchmark-results
          path: |
            benchmarks/complex-suite-v2/results.md
            benchmarks/complex-suite-v2/results.csv
            benchmarks/complex-suite-v2/metadata.json
          if-no-files-found: error
